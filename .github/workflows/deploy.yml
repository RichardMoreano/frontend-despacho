name: CI/CD - Frontend Deploy

on:
  push:
    branches: [ deploy ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend (smoke check)
        run: |
          npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest
